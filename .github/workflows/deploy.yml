name: Deploy Market Radar
on:
  push:
    branches: [main]
  schedule:
    - cron: '45 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate quantitative rules
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Refresh historical close data
        run: python scripts/refresh_market.py
      - name: Validate site build
        run: |
          npm install
          npm run build
          test -f dist/index.html
          grep -q 'assets/' dist/index.html
          if grep -q 'src/main.tsx' dist/index.html; then echo "TypeScript source leaked into deployment"; exit 1; fi
      - name: Install Chromium for browser tests
        if: github.event_name != 'schedule'
        run: npx playwright install --with-deps chromium
      - name: Exercise real app in Chromium
        if: github.event_name != 'schedule'
        run: npm test
      - name: Upload browser screenshot
        if: github.event_name != 'schedule' && success()
        uses: actions/upload-artifact@v4
        with:
          name: market-radar-browser-preview
          path: market-radar-desktop.png
          retention-days: 5
      - name: Upload compiled Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Persist last-good market snapshot
        if: success()
        run: |
          if [ -f public/data/market.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/market.json
            git diff --cached --quiet || (git commit -m "data: update verified close snapshots [skip ci]" && git push)
          fi
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify GitHub Pages serves compiled assets
        run: |
          for attempt in $(seq 1 15); do
            page="$(curl --fail --silent --show-error --location --max-time 15 "https://alejo02025.github.io/marketdata/?rev=$GITHUB_SHA" || true)"
            if echo "$page" | grep -q '/marketdata/assets/index-' && ! echo "$page" | grep -q 'src/main.tsx'; then
              echo "Live GitHub Pages index points to compiled assets."
              exit 0
            fi
            echo "Page not propagated / incorrect HTML, attempt $attempt"
            sleep 8
          done
          echo "Public page failed compiled-HTML check"
          exit 1
