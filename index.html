<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d131c">
<meta name="description" content="Market Radar — investigación financiera personal">
<title>Market Radar — Investment Intelligence</title>
<style>
/* Independent recovery interface if GitHub Pages serves uncompiled source. */
.fallback,.fallback *{box-sizing:border-box}
.fallback{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d1218;color:#e5edf5;min-height:100vh;display:flex;font-size:14px;line-height:1.5}
.fallback button,.fallback input,.fallback select{font:inherit}
.fallback button{cursor:pointer}
.fallback a{color:#9bcbeb;text-decoration:none}
.fallback a:hover{text-decoration:underline}
.fallback aside{background:#111923;border-right:1px solid #293541;width:236px;flex-shrink:0;min-height:100vh;padding:26px 16px;display:flex;flex-direction:column;gap:24px}
.fallback .logo{font-weight:800;letter-spacing:-.6px;font-size:18px;padding:8px;color:#e5f1fa}.fallback .logo b{color:#8ec9e6}
.fallback .logo small{display:block;color:#728698;font-size:9px;letter-spacing:2px;font-weight:600;margin-top:3px}
.fallback nav{display:grid;gap:6px}
.fallback nav button{display:block;width:100%;border:1px solid transparent;padding:12px 14px;text-align:left;border-radius:7px;color:#98a9bb;background:transparent}
.fallback nav button.on{background:#1d2e3c;border-color:#345366;color:#dcf2ff;font-weight:700}
.fallback aside footer{margin-top:auto;font-size:11px;color:#798a9a;line-height:1.8;padding:10px}
.fallback .workspace{min-width:0;flex:1}
.fallback header{padding:23px 36px;border-bottom:1px solid #283440;display:flex;justify-content:space-between;gap:12px;color:#8fa0af;font-size:11px;letter-spacing:1px}
.fallback header strong{color:#d4e6f3}
.fallback .content{max-width:1400px;margin:auto;padding:36px;min-height:80vh}
.fallback .heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin:0 0 25px}
.fallback .eyebrow{font-size:10px;letter-spacing:2px;color:#8aa6bb;font-weight:700}
.fallback h1{font-size:34px;letter-spacing:-1.3px;margin:8px 0;font-weight:800}
.fallback h1 em{color:#90cbe8;font-style:normal}
.fallback .heading p{color:#91a2b0;margin:0}
.fallback h2{font-size:16px;margin:0 0 4px}
.fallback .subtitle{font-size:12px;color:#899cad;margin:0 0 17px}
.fallback .notice{background:#152632;border:1px solid #375468;color:#b4cad9;border-radius:8px;padding:15px 18px;font-size:12px;margin:18px 0 27px}
.fallback .notice strong{color:#e0f1fb}
.fallback .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:28px 0 14px}
.fallback .bar:first-child{margin-top:0}
.fallback input,.fallback select{min-height:38px;background:#151e28;border:1px solid #354654;color:#e5f1f9;border-radius:6px;padding:8px 12px;max-width:100%}
.fallback input::placeholder{color:#718698}
.fallback button.primary{background:#97cbe5;color:#102736;border:1px solid #b2dcef;border-radius:6px;padding:9px 14px;font-weight:750}
.fallback button.secondary{background:#1b2935;color:#c6dbe9;border:1px solid #385062;border-radius:6px;padding:9px 13px}
.fallback button:disabled{opacity:.5}
.fallback .fieldrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:15px 0 25px}
.fallback .fieldrow input{width:220px}
.fallback table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap;min-width:580px}
.fallback th{color:#8399ac;background:#18212b;font-size:10px;letter-spacing:1px;padding:15px}
.fallback td{border-top:1px solid #293642;padding:15px;color:#d4e1eb;font-size:12px}
.fallback td:first-child{font-weight:800;font-size:13px}
.fallback .table{overflow:auto;border:1px solid #293b49;border-radius:8px;background:#121a22}
.fallback .badge{background:#25333f;border:1px solid #3a4b58;color:#aec0ce;padding:4px 8px;border-radius:4px;font-size:10px}
.fallback .clear{background:transparent;color:#90a6b8;border:0;font-size:18px}
.fallback .chart{width:100%;height:490px;border:1px solid #354755;border-radius:9px;overflow:hidden;background:#121a22}
.fallback .chart iframe{width:100%;height:100%;border:0}
.fallback .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fallback .metric,.fallback .tile,.fallback .form{background:#141e28;border:1px solid #304150;border-radius:8px;padding:22px}
.fallback .metric label{display:block;color:#90a5b6;font-size:10px;letter-spacing:1.1px}
.fallback .metric strong{display:block;font-size:25px;margin:10px 0;letter-spacing:-.6px}
.fallback .metric small{color:#8098a8}
.fallback .grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.fallback .tile{display:block;min-height:142px}
.fallback .tile h2{margin:22px 0 8px;color:#e5f1f9}
.fallback .tile p{font-size:12px;color:#92a6b5;margin:0}
.fallback .form{margin:16px 0 25px}
.fallback .formgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}
.fallback .formgrid label{display:grid;gap:6px;color:#95aabe;font-size:12px}
.fallback .formgrid input{width:100%}
.fallback .empty{text-align:center;color:#98a9b6;padding:45px 18px}
.fallback .error{background:#4b252a;border:1px solid #a86269;border-radius:6px;color:#ffe0e2;padding:12px;margin:15px 0}
.fallback .linkrow{display:flex;flex-wrap:wrap;gap:20px;margin-top:20px}
.fallback .footnote{font-size:11px;color:#8298a7;margin-top:20px}
@media(max-width:900px){.fallback aside{width:170px}.fallback .grid4{grid-template-columns:repeat(2,1fr)}.fallback .content{padding:28px 20px}.fallback .formgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.fallback{display:block}.fallback aside{position:static;width:auto;min-height:0;padding:14px;gap:6px}.fallback aside footer{display:none}.fallback nav{grid-template-columns:repeat(4,minmax(0,1fr))}.fallback nav button{font-size:12px;padding:9px 4px;text-align:center}.fallback header{padding:13px 16px}.fallback .content{padding:25px 14px}.fallback h1{font-size:28px}.fallback .grid3{grid-template-columns:1fr}.fallback .grid4{grid-template-columns:1fr 1fr}.fallback .chart{height:350px}.fallback .formgrid{grid-template-columns:1fr 1fr}.fallback .heading{display:block}}
</style>
</head>
<body style="margin:0;background:#0d1218">
<div id="root"></div>
<script>
/* Standalone static recovery UI. React replaces this on a correctly built deployment. */
(function(){
'use strict';
var root=document.getElementById('root');
var section='radar',selected='SPY',error='',formVisible=false;
var starters=['SPY','QQQ','AAPL','MSFT','NVDA','GOOGL','AMZN','META','AVGO','AMD','TSLA','UBER','JPM','V','BRK.B'];
var sourceList=[
['Yahoo Finance','https://finance.yahoo.com/','Cotizaciones, históricos y noticias'],
['TradingView','https://www.tradingview.com/','Gráficos y análisis técnico'],
['Investing.com','https://www.investing.com/','Calendario y mercados'],
['Balanz Research','https://balanz.com/reportes/research/daily/','Mercado argentino'],
['Ámbito','https://www.ambito.com/','Tasas, dólar y noticias'],
['BCRA','https://www.bcra.gob.ar/','Estadísticas monetarias'],
['FRED','https://fred.stlouisfed.org/','Series macroeconómicas oficiales'],
['SEC EDGAR','https://www.sec.gov/edgar/search/','Reportes corporativos']];
function safe(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function valid(t){return /^[A-Z0-9.^-]{1,16}$/.test(t)}
function read(k,d){try{var v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch(e){return d}}
var watch=read('market-radar-watch-v1',starters).filter(function(t){return typeof t==='string'&&valid(t)}).slice(0,75);
var holdings=read('market-radar-portfolio-v1',[]).filter(function(p){return p&&typeof p.id==='string'&&typeof p.ticker==='string'&&valid(p.ticker)&&Number.isFinite(p.shares)&&p.shares>0&&Number.isFinite(p.cost)&&p.cost>=0}).slice(0,500);
function save(){localStorage.setItem('market-radar-watch-v1',JSON.stringify(watch));localStorage.setItem('market-radar-portfolio-v1',JSON.stringify(holdings))}
function quote(t){return 'https://finance.yahoo.com/quote/'+encodeURIComponent(t.replace('.','-'))}
function chart(t){var sym=(t==='SPY'||t==='QQQ'?'AMEX:':t==='BRK.B'?'NYSE:':'NASDAQ:')+t;return '<div class="chart"><iframe title="TradingView '+safe(t)+'" loading="lazy" sandbox="allow-scripts allow-same-origin allow-popups" referrerpolicy="strict-origin-when-cross-origin" src="https://www.tradingview.com/widgetembed/?symbol='+encodeURIComponent(sym)+'&interval=D&theme=dark&style=1&locale=en&withdateranges=1"></iframe></div>'}
function heading(tag,name,subtitle){return '<div class="heading"><div><div class="eyebrow">'+tag+'</div><h1>'+name+'<em>.</em></h1><p>'+subtitle+'</p></div></div>'}
function notice(text){return '<div class="notice">'+text+'</div>'}
function navLink(s,title){return '<button data-section="'+s+'" class="'+(section===s?'on':'')+'">'+title+'</button>'}
function radar(){
var rows=watch.map(function(t){return '<tr><td><button data-analysis="'+safe(t)+'" class="secondary">'+safe(t)+'</button></td><td>En widget externo</td><td><span class="badge">NO EVALUADA</span></td><td><a target="_blank" rel="noopener noreferrer" href="'+quote(t)+'">Yahoo Finance ↗</a></td><td><button class="clear" data-remove="'+safe(t)+'" aria-label="Eliminar ticker">×</button></td></tr>'}).join('');
return heading('MARKET INTELLIGENCE / 01','Radar de mercado','Activos relevantes para inversiones de mediano y largo plazo.')+
notice('<strong>Datos verificables.</strong> Los gráficos son de TradingView y pueden contener precios diferidos. Esta versión no inventa cotizaciones ni señales.')+
'<div class="bar"><div><h2>Watchlist</h2><div class="subtitle">Universo de '+watch.length+' activos</div></div></div><div class="table"><table><thead><tr><th>ACTIVO</th><th>PRECIO</th><th>SEÑAL</th><th>FUENTE</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
'<form id="watchForm" class="fieldrow"><input id="newWatch" aria-label="Nuevo ticker" maxlength="16" placeholder="Agregar ticker (ej. COST)" required><button class="primary" type="submit">+ Añadir al radar</button></form>'+
'<div class="bar"><div><h2>Gráfico de referencia · SPY</h2><p class="subtitle">TradingView · marco diario</p></div><button class="secondary" data-analysis="SPY">Abrir análisis ↗</button></div>'+chart('SPY');
}
function analysis(){
return heading('ASSET RESEARCH / 02','Análisis','Gráficos técnicos externos para estudiar cada compañía.')+
'<div class="bar"><div><h2>Activo seleccionado: '+safe(selected)+'</h2><p class="subtitle">Datos alojados por TradingView</p></div><select id="assetSelect" aria-label="Seleccionar activo">'+[selected].concat(watch.filter(function(x){return x!==selected})).map(function(t){return '<option value="'+safe(t)+'"'+(t===selected?' selected':'')+'>'+safe(t)+'</option>'}).join('')+'</select></div>'+
notice('El gráfico no constituye asesoramiento financiero. No hay señales cuantitativas verificadas ni precios objetivo calculados.')+
chart(selected)+'<div class="form" style="margin-top:18px"><h2>Fuentes para investigar '+safe(selected)+'</h2><div class="linkrow"><a target="_blank" rel="noopener noreferrer" href="'+quote(selected)+'">Yahoo Finance ↗</a><a target="_blank" rel="noopener noreferrer" href="https://www.tradingview.com/">TradingView ↗</a><a target="_blank" rel="noopener noreferrer" href="https://www.sec.gov/edgar/search/">SEC EDGAR ↗</a></div></div>';
}
function portfolio(){
var total=holdings.reduce(function(a,b){return a+b.cost*b.shares},0);
var rows=holdings.map(function(p){return '<tr><td>'+safe(p.ticker)+'</td><td>'+p.shares+'</td><td>USD '+p.cost.toFixed(2)+'</td><td>USD '+(p.cost*p.shares).toFixed(2)+'</td><td>'+safe(p.note||'—')+'</td><td><button data-delete="'+safe(p.id)+'" class="clear" aria-label="Borrar posición">×</button></td></tr>'}).join('');
return heading('PRIVATE HOLDINGS / 03','Mi cartera','Posiciones guardadas únicamente en este navegador.')+
'<div class="grid3"><div class="metric"><label>COSTO REGISTRADO</label><strong>USD '+total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'</strong><small>No equivale a valuación de mercado</small></div><div class="metric"><label>POSICIONES</label><strong>'+holdings.length+'</strong><small>Entradas manuales</small></div><div class="metric"><label>VALUACIÓN ACTUAL</label><strong>—</strong><small>Requiere un feed confiable</small></div></div>'+
notice('<strong>Privacidad local:</strong> la cartera no se sincroniza ni está cifrada. Exportá un respaldo antes de borrar datos del navegador.')+
'<div class="bar"><div><h2>Posiciones registradas</h2><p class="subtitle">Costo de adquisición, cantidades y notas</p></div><div class="fieldrow"><button class="secondary" data-export="1">↓ Exportar JSON</button><label class="secondary" style="position:relative">↑ Importar JSON <input id="importFile" type="file" accept=".json,application/json" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer"></label><button class="primary" data-showform="1">+ Añadir posición</button></div></div>'+
(formVisible?'<form class="form" id="holdingForm"><h2>Nueva posición</h2><div class="formgrid"><label>Ticker<input id="ticker" required maxlength="16" placeholder="SPY"></label><label>Cantidad<input id="shares" required type="number" min="0.000001" step="any"></label><label>Costo unitario (USD)<input id="cost" required type="number" min="0" step="any"></label><label>Nota<input id="note" maxlength="150"></label></div><button type="submit" class="primary">Guardar posición</button></form>':'')+
'<div class="table"><table><thead><tr><th>TICKER</th><th>CANTIDAD</th><th>COSTO UNIT.</th><th>COSTO TOTAL</th><th>NOTA</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'+(holdings.length?'':'<div class="empty">Sin posiciones todavía. Añadí tu primera compra.</div>')+'</div>';
}
function daily(){return heading('DAILY BRIEFING / 04','Market Daily','Fuentes de información financiera internacional y argentina.')+
notice('<strong>Sin datos inventados.</strong> Aún no existe un servicio que genere y verifique automáticamente un briefing diario. Estas fuentes son enlaces directos.')+
'<div class="bar"><div><h2>Fuentes de investigación</h2><p class="subtitle">Información de mercado, macroeconomía y reportes corporativos</p></div></div>'+
'<div class="grid4">'+sourceList.map(function(x){return '<a class="tile" target="_blank" rel="noopener noreferrer" href="'+x[1]+'"><div style="color:#91cbe6">↗ Fuente oficial / pública</div><h2>'+safe(x[0])+'</h2><p>'+safe(x[2])+'</p></a>'}).join('')+'</div><div class="form" style="margin-top:25px"><div class="eyebrow">MARKET ENGLISH · B1</div><h2 style="margin-top:12px">Market vocabulary</h2><p>Stock prices can rise or fall. Investors should evaluate company results before making decisions.</p><p class="subtitle">Los precios pueden subir o bajar. Los inversores deberían analizar los resultados de las empresas antes de tomar decisiones.</p></div>';}
function render(){
var content=section==='radar'?radar():section==='analysis'?analysis():section==='portfolio'?portfolio():daily();
root.innerHTML='<div class="fallback"><aside><div class="logo">◉ MARKET<b>RADAR</b><small>INVESTMENT INTELLIGENCE</small></div><nav>'+navLink('radar','Radar')+navLink('analysis','Análisis')+navLink('portfolio','Cartera')+navLink('daily','Daily')+'</nav><footer>RESEARCH TERMINAL · v0.1<br>Uso personal · Datos externos</footer></aside><div class="workspace"><header><span>PERSONAL WORKSPACE / <strong>'+section.toUpperCase()+'</strong></span><span>SOURCES: EXTERNAL</span></header><main class="content">'+(error?'<div class="error" role="alert">'+safe(error)+'</div>':'')+content+'<p class="footnote">Market Radar · interfaz de recuperación estática. Si el bundle React se carga, reemplazará automáticamente esta vista.</p></main></div></div>';
}
root.addEventListener('click',function(ev){
var b=ev.target.closest('button');if(!b)return;
if(b.dataset.section){section=b.dataset.section;error='';render()}
if(b.dataset.analysis){selected=b.dataset.analysis;section='analysis';render()}
if(b.dataset.remove){watch=watch.filter(function(x){return x!==b.dataset.remove});save();render()}
if(b.dataset.showform){formVisible=!formVisible;render()}
if(b.dataset.delete){if(confirm('¿Eliminar esta posición?')){holdings=holdings.filter(function(p){return p.id!==b.dataset.delete});save();render()}}
if(b.dataset.export){var file=new Blob([JSON.stringify({schema:1,exportedAt:new Date().toISOString(),holdings:holdings,watch:watch},null,2)],{type:'application/json'});var u=URL.createObjectURL(file);var a=document.createElement('a');a.href=u;a.download='market-radar-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}
});
root.addEventListener('change',function(ev){
if(ev.target.id==='assetSelect'){selected=ev.target.value;render()}
if(ev.target.id==='importFile'&&ev.target.files&&ev.target.files[0]){
var f=ev.target.files[0];if(f.size>1000000){error='Archivo demasiado grande';render();return}
f.text().then(function(t){var d=JSON.parse(t);if(d.schema!==1||!Array.isArray(d.holdings)||!Array.isArray(d.watch))throw Error('Respaldo incompatible');
if(d.holdings.some(function(p){return !p||typeof p.id!=='string'||typeof p.ticker!=='string'||!valid(p.ticker)||!Number.isFinite(p.shares)||p.shares<=0||!Number.isFinite(p.cost)||p.cost<0}))throw Error('Datos de posiciones inválidos');
if(!confirm('¿Reemplazar la cartera y watchlist locales?'))return;
holdings=d.holdings.slice(0,500);watch=d.watch.filter(function(t){return typeof t==='string'&&valid(t)}).slice(0,75);save();error='';render()}).catch(function(e){error=e.message||'No se pudo importar';render()})
}
});
root.addEventListener('submit',function(ev){
ev.preventDefault();
if(ev.target.id==='watchForm'){var t=document.getElementById('newWatch').value.trim().toUpperCase();if(!valid(t)){error='Ticker inválido'}else{if(!watch.includes(t))watch.unshift(t);save();error=''}render()}
if(ev.target.id==='holdingForm'){var t=document.getElementById('ticker').value.trim().toUpperCase(),q=Number(document.getElementById('shares').value),c=Number(document.getElementById('cost').value),n=document.getElementById('note').value;if(!valid(t)||!Number.isFinite(q)||q<=0||!Number.isFinite(c)||c<0){error='Posición inválida';render();return}holdings.unshift({id:'local-'+Date.now()+'-'+Math.random().toString(36).slice(2),ticker:t,shares:q,cost:c,note:n});save();formVisible=false;error='';render()}
});
render();
})();
</script>
<script type="module" src="./src/main.tsx"></script>
</body>
</html>
